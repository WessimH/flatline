name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test, docs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --release -- -D warnings
      - name: Tests (unit + doc)
        run: cargo test --release
      - name: Rustdoc (warnings are errors)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Non-blocking coverage report (FLA-27). The job never fails on a low
  # percentage: there is no --fail-under-lines here. A threshold will be
  # added only after the PO validates it.
  coverage:
    name: Coverage (report only)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Run tests with coverage
        run: cargo llvm-cov --release --no-report
      - name: Coverage summary
        shell: bash
        run: |
          {
            echo "## Test coverage (lines, report only)"
            echo
            echo '```'
            cargo llvm-cov report --release --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
